name: 'Conventional Release Automator'
description: 'Automated release workflow with conventional commits and changelog generation'
author: hsayed

inputs:
  version:
    description: 'Semver bump type'
    required: true
    default: patch
  release-version:
    description: 'Optional exact version to release instead of calculating a bump'
    required: false
    default: ''
  update-latest-release:
    description: 'Rebuild and update the latest published release without changing its version'
    required: false
    default: false
    type: boolean
  release-command:
    description: 'Optional command to run after versioning and before publishing the release'
    required: false
    default: ''
  release-command-shell:
    description: 'Shell used to run release-command'
    required: false
    default: 'bash'
  include-non-conventional:
    description: 'Include non-conventional commits in release notes'
    required: false
    default: false
    type: boolean
  files-pattern:
    description: 'Extra files to upload (glob, e.g. dist/*.zip)'
    required: false
    default: ''
    type: string
  publish-vsce:
    description: 'Publish to VS Code Marketplace'
    required: false
    default: false
    type: boolean
  generate-changelog:
    description: 'Generate CHANGELOG.md file'
    required: false
    default: false
    type: boolean
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  initial-version:
    description: 'Initial semver version when package.json is created automatically'
    required: false
    default: '0.0.0'

outputs:
  version:
    description: 'The version that was released'
    value: ${{ steps.bump.outputs.version }}
  tag:
    description: 'The git tag that was created'
    value: ${{ steps.bump.outputs.tag }}
  release-url:
    description: 'The URL of the created GitHub release'
    value: ${{ steps.release.outputs.url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
        clean: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Configure Git identity
      shell: bash
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Save rollback info
      id: rollback-save
      shell: bash
      run: |
        echo "previous-commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Resolve release version and tag
      id: bump
      shell: bash
      env:
        INITIAL_VERSION: ${{ inputs.initial-version }}
        UPDATE_LATEST_RELEASE: ${{ inputs.update-latest-release }}
        GH_TOKEN: ${{ env.GITHUB_TOKEN }}
        GH_API_URL: ${{ github.api_url }}
        GH_REPOSITORY: ${{ github.repository }}
      run: |
        npm_version_args=()
        previous_tag=''

        while IFS= read -r candidate; do
          if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            previous_tag="$candidate"
            break
          fi
        done < <(git tag --list 'v*' --sort=-version:refname)

        if [[ "$UPDATE_LATEST_RELEASE" == "true" ]]; then
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GITHUB_TOKEN is required to resolve the latest published release."
            exit 1
          fi

          tag=$(
            curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GH_API_URL/repos/$GH_REPOSITORY/releases/latest" |
              node -e '
                let json = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => json += chunk);
                process.stdin.on("end", () => {
                  const release = JSON.parse(json);
                  if (!release.tag_name) throw new Error("Latest release does not have a tag.");
                  if (release.immutable) throw new Error("Latest release is immutable and cannot be updated.");
                  process.stdout.write(release.tag_name);
                });
              '
          )

          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest release tag '$tag' is not a supported stable semantic version."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::Latest release tag '$tag' was not fetched from the repository."
            exit 1
          fi

          previous_tag_object=$(git rev-parse "refs/tags/$tag")
          previous_tag_commit=$(git rev-parse "$tag^{commit}")

          if ! git merge-base --is-ancestor "$previous_tag_commit" HEAD; then
            echo "::error::Latest release tag '$tag' is not an ancestor of the current commit."
            exit 1
          fi

          commits_after_release=$(git rev-list --count "$previous_tag_commit..HEAD")
          if [[ "$commits_after_release" -eq 0 ]]; then
            echo "::error::There are no commits after the latest release '$tag'."
            exit 1
          fi

          echo "mode=update" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "previous-tag-object=$previous_tag_object" >> "$GITHUB_OUTPUT"
          echo "previous-tag-commit=$previous_tag_commit" >> "$GITHUB_OUTPUT"
          echo "commits-after-release=$commits_after_release" >> "$GITHUB_OUTPUT"
          echo "Updating release $tag with $commits_after_release new commit(s)."
          exit 0
        fi

        if [[ ! -f package.json ]]; then
          node -e 'const fs = require("fs"); fs.writeFileSync("package.json", JSON.stringify({ name: "release-package", version: process.env.INITIAL_VERSION, private: true }, null, 2) + "\n")'
          echo "package.json was missing; created a version manifest."
          # The newly created, untracked manifest makes npm see a dirty tree.
          # Force lets npm stage it and include it in its release commit.
          npm_version_args+=(--force)
        fi

        requested_version="${{ inputs.release-version }}"
        if [[ -z "$requested_version" && -n "$previous_tag" ]]; then
          base_version="${previous_tag#v}"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest tag $previous_tag is not a supported stable semantic version."
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$base_version"
          case "${{ inputs.version }}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *)
              echo "::error::Unsupported version bump: ${{ inputs.version }}"
              exit 1
              ;;
          esac
          requested_version="$major.$minor.$patch"
        elif [[ -z "$requested_version" ]]; then
          requested_version="${{ inputs.version }}"
        fi

        npm version "$requested_version" -m "chore: release %s" "${npm_version_args[@]}"
        tag=$(git describe --tags --abbrev=0)
        echo "mode=new" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        echo "previous-tag-object=" >> "$GITHUB_OUTPUT"

    - name: Run release command
      if: ${{ inputs.release-command != '' }}
      shell: ${{ inputs.release-command-shell }}
      env:
        RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        RELEASE_TAG: ${{ steps.bump.outputs.tag }}
      run: ${{ inputs.release-command }}

    - name: Move latest release tag
      if: ${{ inputs.update-latest-release == 'true' }}
      shell: bash
      run: |
        git tag --force --annotate "${{ steps.bump.outputs.tag }}" \
          --message "Update release ${{ steps.bump.outputs.tag }}" HEAD

    - name: Generate CHANGELOG.md
      if: ${{ inputs.generate-changelog == 'true' }}
      shell: bash
      run: 'npx --yes auto-changelog@2.6.0 --hide-credit --hide-empty-releases --ignore-commit-pattern "^chore: release"'

    - name: Commit CHANGELOG
      if: ${{ inputs.generate-changelog == 'true' }}
      shell: bash
      run: |
        git add CHANGELOG.md

        if ! git diff --cached --quiet; then
          if [[ "${{ steps.bump.outputs.mode }}" == "update" ]]; then
            git commit --message "chore: release ${{ steps.bump.outputs.version }} (update)"
          else
            git commit --amend --no-edit
          fi
        fi

        git tag --force --annotate "${{ steps.bump.outputs.tag }}" --message "Release ${{ steps.bump.outputs.tag }}"

    - name: Push commit & tag
      id: push
      shell: bash
      run: |
        TAG="${{ steps.bump.outputs.tag }}"
        MODE="${{ steps.bump.outputs.mode }}"
        BRANCH=$(git symbolic-ref --quiet --short HEAD || true)
        PUSHED_COMMIT=$(git rev-parse HEAD)

        if [[ -z "$BRANCH" ]]; then
          echo "::error::Releases must run from a branch, not a detached HEAD."
          exit 1
        fi

        if [[ "$MODE" == "update" ]]; then
          OLD_TAG_OBJECT="${{ steps.bump.outputs.previous-tag-object }}"
          git push --atomic \
            --force-with-lease="refs/tags/$TAG:$OLD_TAG_OBJECT" \
            origin HEAD "refs/tags/$TAG"
        else
          git push --atomic origin HEAD "refs/tags/$TAG"
        fi

        echo "completed=true" >> "$GITHUB_OUTPUT"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        echo "pushed-commit=$PUSHED_COMMIT" >> "$GITHUB_OUTPUT"
        TAG_OBJECT=$(git rev-parse "refs/tags/$TAG")
        echo "tag-object=$TAG_OBJECT" >> "$GITHUB_OUTPUT"

    - name: Publish & package extension
      if: ${{ inputs.publish-vsce == 'true' }}
      uses: HaaLeo/publish-vscode-extension@v2
      with:
        pat:         ${{ env.VSCE_PAT }}
        registryUrl: https://marketplace.visualstudio.com

    - name: Write changelog config
      env:
        INCLUDE_NON_CONV: ${{ inputs.include-non-conventional }}
        REPO_URL:         ${{ github.server_url }}/${{ github.repository }}
      shell: bash
      run: |
        python3 << 'PYEOF'
        import json, os

        include_non_conv = os.environ.get("INCLUDE_NON_CONV", "false").lower() == "true"
        repo             = os.environ.get("REPO_URL", "")

        CONV = r"^.{0,6}(?!chore:\s*release)(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert):"
        ALL  = r"^(?!.{0,6}chore:\s*release)"

        config = {
          "categories": [
            {
              "title": "## What's Changed",
              "rules": [{"pattern": ALL if include_non_conv else CONV, "on_property": "title"}]
            }
          ],
          "ignore_labels": ["ignore"],
          "sort": {"order": "DESC", "on_property": "mergedAt"},
          "template":      "#{{CHANGELOG}}\n\n**Full Changelog**: [`#{{FROM_TAG}}...#{{TO_TAG}}`](" + repo + "/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
          "pr_template":   "- #{{TITLE}} by @#{{AUTHOR}} ([`#{{MERGE_SHA}}`](" + repo + "/commit/#{{MERGE_SHA}}))",
          "empty_template": "_No changes in this release._",
          "trim_values":    True
        }

        out = json.dumps(config, indent=2, ensure_ascii=False)
        with open(".changelog-config.json", "w") as f:
          f.write(out)
        print(out)
        PYEOF

    - name: Generate changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@v5
      with:
        token:         ${{ env.GITHUB_TOKEN }}
        toTag:         ${{ steps.bump.outputs.tag }}
        configuration: .changelog-config.json
        mode:          "COMMIT"
        failOnError:   true

    - name: Shorten commit hashes
      id: notes
      shell: bash
      run: |
        NOTES=$(cat << 'NOTES_EOF'
        ${{ steps.changelog.outputs.changelog }}
        NOTES_EOF
        )
        NOTES=$(echo "$NOTES" | sed -E 's/([a-f0-9]{7})[a-f0-9]{33}/\1/g')

        {
          echo "changelog<<EOF"
          echo "$NOTES"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create or update GitHub release
      id: release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.bump.outputs.tag }}
        body:     ${{ steps.notes.outputs.changelog }}
        overwrite_files: true
        files: |
          ${{ inputs.publish-vsce == 'true' && '*.vsix' || '' }}
          ${{ inputs.files-pattern }}

    - name: Rollback on failure
      if: failure()
      shell: bash
      run: |
        echo "::error::Release failed — rolling back tag and commit..."

        TAG="${{ steps.bump.outputs.tag }}"
        MODE="${{ steps.bump.outputs.mode }}"
        PREV="${{ steps.rollback-save.outputs.previous-commit }}"
        OLD_TAG_OBJECT="${{ steps.bump.outputs.previous-tag-object }}"
        NEW_TAG_OBJECT="${{ steps.push.outputs.tag-object }}"
        PUSHED_COMMIT="${{ steps.push.outputs.pushed-commit }}"
        BRANCH="${{ steps.push.outputs.branch }}"
        PUSH_COMPLETED="${{ steps.push.outputs.completed }}"

        if [[ "$MODE" == "update" && -n "$TAG" && -n "$OLD_TAG_OBJECT" ]]; then
          git update-ref "refs/tags/$TAG" "$OLD_TAG_OBJECT"

          if [[ "$PUSH_COMPLETED" == "true" && -n "$NEW_TAG_OBJECT" ]]; then
            git push \
              --force-with-lease="refs/tags/$TAG:$NEW_TAG_OBJECT" \
              origin "refs/tags/$TAG:refs/tags/$TAG" \
              || echo "Failed to restore remote tag $TAG"
          else
            echo "Remote tag was not updated by this run; leaving it unchanged."
          fi
        elif [[ -n "$TAG" ]]; then
          if [[ "$PUSH_COMPLETED" == "true" && -n "$NEW_TAG_OBJECT" ]]; then
            git push \
              --force-with-lease="refs/tags/$TAG:$NEW_TAG_OBJECT" \
              origin ":refs/tags/$TAG" \
              || echo "Failed to delete remote tag $TAG"
          fi

          git tag -d "$TAG" 2>/dev/null || echo "Local tag not found"
        fi

        if [[ -n "$PREV" ]]; then
          git reset --hard "$PREV"

          if [[ "$PUSH_COMPLETED" == "true" && -n "$BRANCH" && -n "$PUSHED_COMMIT" ]]; then
            git push \
              --force-with-lease="refs/heads/$BRANCH:$PUSHED_COMMIT" \
              origin "HEAD:refs/heads/$BRANCH" \
              || echo "Failed to restore remote branch $BRANCH"
          fi
        fi

        echo "::error::Rollback complete — tag and commit have been rolled back."

branding:
  icon: 'package'
  color: 'blue'
