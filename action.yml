name: 'Conventional Release Automator'
description: 'Automated release workflow with conventional commits and changelog generation'
author: hsayed

inputs:
  version:
    description: 'Semver bump type'
    required: true
    default: patch
  release-version:
    description: 'Optional exact version to release instead of calculating a bump'
    required: false
    default: ''
  release-command:
    description: 'Optional command to run after versioning and before publishing the release'
    required: false
    default: ''
  release-command-shell:
    description: 'Shell used to run release-command'
    required: false
    default: 'bash'
  include-non-conventional:
    description: 'Include non-conventional commits in release notes'
    required: false
    default: false
    type: boolean
  files-pattern:
    description: 'Extra files to upload (glob, e.g. dist/*.zip)'
    required: false
    default: ''
    type: string
  publish-vsce:
    description: 'Publish to VS Code Marketplace'
    required: false
    default: false
    type: boolean
  generate-changelog:
    description: 'Generate CHANGELOG.md file'
    required: false
    default: false
    type: boolean
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  initial-version:
    description: 'Initial semver version when package.json is created automatically'
    required: false
    default: '0.0.0'

outputs:
  version:
    description: 'The version that was released'
    value: ${{ steps.bump.outputs.version }}
  tag:
    description: 'The git tag that was created'
    value: ${{ steps.bump.outputs.tag }}
  release-url:
    description: 'The URL of the created GitHub release'
    value: ${{ steps.release.outputs.url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
        clean: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Configure Git identity
      shell: bash
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Save rollback info
      id: rollback-save
      shell: bash
      run: |
        echo "previous-commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Bump version & create tag
      id: bump
      shell: bash
      env:
        INITIAL_VERSION: ${{ inputs.initial-version }}
      run: |
        npm_version_args=()
        previous_tag=''

        while IFS= read -r candidate; do
          if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            previous_tag="$candidate"
            break
          fi
        done < <(git tag --list 'v*' --sort=-version:refname)

        if [[ ! -f package.json ]]; then
          node -e 'const fs = require("fs"); fs.writeFileSync("package.json", JSON.stringify({ name: "release-package", version: process.env.INITIAL_VERSION, private: true }, null, 2) + "\n")'
          echo "package.json was missing; created a version manifest."
          # The newly created, untracked manifest makes npm see a dirty tree.
          # Force lets npm stage it and include it in its release commit.
          npm_version_args+=(--force)
        fi

        requested_version="${{ inputs.release-version }}"
        if [[ -z "$requested_version" && -n "$previous_tag" ]]; then
          base_version="${previous_tag#v}"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest tag $previous_tag is not a supported stable semantic version."
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$base_version"
          case "${{ inputs.version }}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *)
              echo "::error::Unsupported version bump: ${{ inputs.version }}"
              exit 1
              ;;
          esac
          requested_version="$major.$minor.$patch"
        elif [[ -z "$requested_version" ]]; then
          requested_version="${{ inputs.version }}"
        fi

        npm version "$requested_version" -m "chore: release %s" "${npm_version_args[@]}"
        tag=$(git describe --tags --abbrev=0)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

    - name: Run release command
      if: ${{ inputs.release-command != '' }}
      shell: ${{ inputs.release-command-shell }}
      env:
        RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        RELEASE_TAG: ${{ steps.bump.outputs.tag }}
      run: ${{ inputs.release-command }}

    - name: Generate CHANGELOG.md
      if: ${{ inputs.generate-changelog == 'true' }}
      shell: bash
      run: 'npx --yes auto-changelog@2.6.0 --hide-credit --hide-empty-releases --ignore-commit-pattern "^chore: release"'

    - name: Commit CHANGELOG
      if: ${{ inputs.generate-changelog == 'true' }}
      shell: bash
      run: |
        git add CHANGELOG.md
        git commit --amend --no-edit
        git tag --force --annotate "${{ steps.bump.outputs.tag }}" --message "Release ${{ steps.bump.outputs.tag }}"

    - name: Push commit & tag
      id: push
      shell: bash
      run: |
        git push --atomic origin HEAD "refs/tags/${{ steps.bump.outputs.tag }}"
        echo "completed=true" >> "$GITHUB_OUTPUT"

    - name: Publish & package extension
      if: ${{ inputs.publish-vsce == 'true' }}
      uses: HaaLeo/publish-vscode-extension@v2
      with:
        pat:         ${{ env.VSCE_PAT }}
        registryUrl: https://marketplace.visualstudio.com

    - name: Write changelog config
      env:
        INCLUDE_NON_CONV: ${{ inputs.include-non-conventional }}
        REPO_URL:         ${{ github.server_url }}/${{ github.repository }}
      shell: bash
      run: |
        python3 << 'PYEOF'
        import json, os

        include_non_conv = os.environ.get("INCLUDE_NON_CONV", "false").lower() == "true"
        repo             = os.environ.get("REPO_URL", "")

        CONV = r"^.{0,6}(?!chore:\s*release)(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert):"
        ALL  = r"^(?!.{0,6}chore:\s*release)"

        config = {
          "categories": [
            {
              "title": "## What's Changed",
              "rules": [{"pattern": ALL if include_non_conv else CONV, "on_property": "title"}]
            }
          ],
          "ignore_labels": ["ignore"],
          "sort": {"order": "DESC", "on_property": "mergedAt"},
          "template":      "#{{CHANGELOG}}\n\n**Full Changelog**: [`#{{FROM_TAG}}...#{{TO_TAG}}`](" + repo + "/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
          "pr_template":   "- #{{TITLE}} by @#{{AUTHOR}} ([`#{{MERGE_SHA}}`](" + repo + "/commit/#{{MERGE_SHA}}))",
          "empty_template": "_No changes in this release._",
          "trim_values":    True
        }

        out = json.dumps(config, indent=2, ensure_ascii=False)
        with open(".changelog-config.json", "w") as f:
          f.write(out)
        print(out)
        PYEOF

    - name: Generate changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@v5
      with:
        token:         ${{ env.GITHUB_TOKEN }}
        toTag:         ${{ steps.bump.outputs.tag }}
        configuration: .changelog-config.json
        mode:          "COMMIT"
        failOnError:   true

    - name: Shorten commit hashes
      id: notes
      shell: bash
      run: |
        NOTES=$(cat << 'NOTES_EOF'
        ${{ steps.changelog.outputs.changelog }}
        NOTES_EOF
        )
        NOTES=$(echo "$NOTES" | sed -E 's/([a-f0-9]{7})[a-f0-9]{33}/\1/g')

        {
          echo "changelog<<EOF"
          echo "$NOTES"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      id: release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.bump.outputs.tag }}
        body:     ${{ steps.notes.outputs.changelog }}
        files: |
          ${{ inputs.publish-vsce == 'true' && '*.vsix' || '' }}
          ${{ inputs.files-pattern }}

    - name: Rollback on failure
      if: failure()
      shell: bash
      run: |
        echo "::error::Release failed — rolling back tag and commit..."
        
        TAG="${{ steps.bump.outputs.tag }}"
        PREV="${{ steps.rollback-save.outputs.previous-commit }}"

        if [[ "${{ steps.push.outputs.completed }}" == "true" ]]; then
          git push --delete origin "$TAG" 2>/dev/null || echo "Remote tag not found"
        else
          echo "Remote tag was not pushed by this run; leaving remote tags unchanged."
        fi

        if [[ -n "$TAG" ]]; then
          git tag -d "$TAG" 2>/dev/null || echo "Local tag not found"
        fi

        if [[ -n "$PREV" ]]; then
          git reset --hard "$PREV"
          if [[ "${{ steps.push.outputs.completed }}" == "true" ]]; then
            git push origin HEAD --force-with-lease
          fi
        fi
        
        echo "::error::Rollback complete — tag and commit have been rolled back."

branding:
  icon: 'package'
  color: 'blue'
